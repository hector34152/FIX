<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganchos y Conexiones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-4 font-sans text-gray-800">

    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        
        <!-- Encabezado -->
        <div class="border-b pb-4 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-gray-800">Reporte de Ganchos y Conexiones</h1>
                <p class="text-xs text-gray-500">Control de Ceros, Capacidad e Inventario de Tubos y Conexiones</p>
            </div>
            <span class="text-xs bg-orange-100 text-orange-800 font-semibold px-3 py-1 rounded-full">FIX FERRETERÍAS</span>
        </div>

        <form>
            <!-- SECCIÓN 1: GANCHOS (CEROS VS <50%) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative mb-8">
                <div class="hidden md:block absolute inset-y-0 left-1/2 -ml-px bg-gray-200 w-px"></div>

                <!-- COLUMNA 1: CEROS -->
                <div>
                    <div class="bg-red-50 text-red-800 p-2.5 rounded font-bold text-sm mb-3 border border-red-200 flex justify-between items-center">
                        <span><i class="fa-solid fa-circle-xmark text-red-600 mr-2"></i>CEROS</span>
                        <span id="count-ceros" class="text-xs bg-white px-2 py-0.5 rounded border border-red-300 font-mono">0</span>
                    </div>

                    <div class="max-h-[400px] overflow-y-auto border rounded bg-gray-50 p-2">
                        <table class="w-full text-sm">
                            <thead class="text-xs text-gray-500 uppercase border-b bg-gray-100">
                                <tr>
                                    <th class="py-1 px-2 w-10 text-center">#</th>
                                    <th class="py-1 px-2 text-left">Código / SKU</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-ceros" class="divide-y bg-white">
                                <!-- Filas dinámicas -->
                            </tbody>
                        </table>
                    </div>
                    <button type="button" onclick="addRow('tbody-ceros', 'ceros')" class="mt-2 w-full py-1.5 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded text-xs text-gray-700 font-medium">
                        + Agregar Fila de Cero
                    </button>
                </div>

                <!-- COLUMNA 2: MENOS DEL 50% -->
                <div>
                    <div class="bg-amber-50 text-amber-800 p-2.5 rounded font-bold text-sm mb-3 border border-amber-200 flex justify-between items-center">
                        <span><i class="fa-solid fa-chart-pie text-amber-600 mr-2"></i> -50%</span>
                        <span id="count-50" class="text-xs bg-white px-2 py-0.5 rounded border border-amber-300 font-mono">0</span>
                    </div>

                    <div class="max-h-[400px] overflow-y-auto border rounded bg-gray-50 p-2">
                        <table class="w-full text-sm">
                            <thead class="text-xs text-gray-500 uppercase border-b bg-gray-100">
                                <tr>
                                    <th class="py-1 px-2 w-10 text-center">#</th>
                                    <th class="py-1 px-2 text-left">Código / SKU</th>
                                    <th class="py-1 px-2 w-20 text-center">Cant.</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-50" class="divide-y bg-white">
                                <!-- Filas dinámicas -->
                            </tbody>
                        </table>
                    </div>
                    <button type="button" onclick="addRow('tbody-50', '50')" class="mt-2 w-full py-1.5 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded text-xs text-gray-700 font-medium">
                        + Agregar Fila <50%
                    </button>
                </div>
            </div>

            <!-- SECCIÓN 2: TUBOS Y CONEXIONES -->
            <div class="border-t pt-6">
                <div class="bg-blue-50 text-blue-900 p-2.5 rounded font-bold text-sm mb-3 border border-blue-200 flex justify-between items-center">
                    <span><i class="fa-solid fa-faucet text-blue-600 mr-2"></i>CONEXIONES</span>
                    <span id="count-conexiones" class="text-xs bg-white px-2 py-0.5 rounded border border-blue-300 font-mono">0</span>
                </div>

                <div class="max-h-[300px] overflow-y-auto border rounded bg-gray-50 p-2">
                    <table class="w-full text-sm">
                        <thead class="text-xs text-gray-500 uppercase border-b bg-gray-100">
                            <tr>
                                <th class="py-1 px-2 w-10 text-center">#</th>
                                <th class="py-1 px-2 text-left">Código / SKU</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-conexiones" class="divide-y bg-white">
                            <!-- Filas dinámicas -->
                        </tbody>
                    </table>
                </div>
                <button type="button" onclick="addRow('tbody-conexiones', 'conexiones')" class="mt-2 w-full py-1.5 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded text-xs text-gray-700 font-medium">
                    + Agregar Conexión / Tubo
                </button>
            </div>

            <!-- BOTONES FINALES -->
            <div class="mt-8 pt-4 border-t flex justify-end gap-3">
                <button type="submit" class="bg-orange-600 hover:bg-orange-700 text-white font-medium px-6 py-2 rounded transition-colors text-sm shadow">
                    Guardar Auditoría
                </button>
            </div>
        </form>

    </div>

    <!-- SCRIPT PARA GENERACIÓN DINÁMICA DE HASTA 100+ FILAS -->
    <script>
        // Inicializar con 5 filas por tabla
        document.addEventListener("DOMContentLoaded", () => {
            for(let i = 0; i < 5; i++) {
                addRow('tbody-ceros', 'ceros');
                addRow('tbody-50', '50');
                addRow('tbody-conexiones', 'conexiones');
            }
        });

        function addRow(tableId, type) {
            const tbody = document.getElementById(tableId);
            const rowCount = tbody.children.length + 1;
            const tr = document.createElement('tr');

            let innerHTML = `<td class="py-1 px-2 text-center text-gray-400 font-mono text-xs">${rowCount}</td>`;

            if (type === 'ceros') {
                innerHTML += `<td class="py-1 px-2"><input type="text" placeholder="Código..." class="w-full p-1 border rounded font-mono uppercase focus:ring-1 focus:ring-orange-500 outline-none text-xs"></td>`;
            } else if (type === '50') {
                innerHTML += `
                    <td class="py-1 px-2"><input type="text" placeholder="Código..." class="w-full p-1 border rounded font-mono uppercase focus:ring-1 focus:ring-orange-500 outline-none text-xs"></td>
                    <td class="py-1 px-2"><input type="number" min="1" placeholder="Cant." class="w-full p-1 border rounded text-center focus:ring-1 focus:ring-orange-500 outline-none text-xs"></td>
                `;
            } else if (type === 'conexiones') {
                innerHTML += `
                    <td class="py-1 px-2"><input type="text" placeholder="Código..." class="w-full p-1 border rounded font-mono uppercase focus:ring-1 focus:ring-orange-500 outline-none text-xs"></td>
                `;
            }

            tr.innerHTML = innerHTML;
            tbody.appendChild(tr);
            
            // Actualizar el contador del encabezado
            document.getElementById(`count-${type}`).innerText = rowCount;
        }
    </script>
</body>
</html>
