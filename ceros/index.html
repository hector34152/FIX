<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganchos y Conexiones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-4 font-sans text-gray-800">

    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        
        <!-- Encabezado -->
        <div class="border-b pb-4 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-gray-800">Reporte de Ganchos y Conexiones</h1>
                <p class="text-xs text-gray-500">Control de Ceros, -50% y Conexiones</p>
            </div>
            <span class="text-xs bg-orange-100 text-orange-800 font-semibold px-3 py-1 rounded-full">FIX FERRETERÍAS</span>
        </div>
            <!-- SECCIÓN 1: GANCHOS (CEROS VS <50%) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative mb-8">
                <div class="hidden md:block absolute inset-y-0 left-1/2 -ml-px bg-gray-200 w-px"></div>

                <!-- COLUMNA 1: CEROS -->
                <div>
                    <div class="bg-red-50 text-red-800 p-2.5 rounded font-bold text-sm mb-3 border border-red-200 flex justify-between items-center">
                        <span><i class="fa-solid fa-circle-xmark text-red-600 mr-2"></i>CEROS</span>
                    </div>

                    <div class="max-h-[400px] overflow-y-auto border rounded bg-gray-50 p-2">
                        <table class="w-full text-sm">
                            <tbody id="tbody-ceros" class="divide-y bg-white">
                                <textarea id="auto-textarea" rows="1" placeholder="CODIGO" oninput="this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px';" class="w-full resize-none overflow-hidden rounded-xl border border-slate-300 bg-white p-3 text-slate-800 placeholder-slate-400 shadow-sm transition-all focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-700 "></textarea>

                            </tbody>
                        </table>
                    </div>
                </div>
                <div>
                    <div class="bg-amber-50 text-amber-800 p-2.5 rounded font-bold text-sm mb-3 border border-amber-200 flex justify-between items-center">
                        <span><i class="fa-solid fa-chart-pie text-amber-600 mr-2"></i> -50%</span>
                    </div>

                    <div class="max-h-[400px] overflow-y-auto border rounded bg-gray-50 p-2">
                        <table class="w-full text-sm">
                            <tbody id="tbody-50" class="divide-y bg-white">
                                <textarea id="auto-textarea" rows="1" placeholder="CODIGO" oninput="this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px';" class="w-full resize-none overflow-hidden rounded-xl border border-slate-300 bg-white p-3 text-slate-800 placeholder-slate-400 shadow-sm transition-all focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-700 "></textarea>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 2: TUBOS Y CONEXIONES -->
            <div class="border-t pt-6">
                <div class="bg-blue-50 text-blue-900 p-2.5 rounded font-bold text-sm mb-3 border border-blue-200 flex justify-between items-center">
                    <span><i class="fa-solid fa-faucet text-blue-600 mr-2"></i>CONEXIONES</span>
                </div>
                <div class="max-h-[300px] overflow-y-auto border rounded bg-gray-50 p-2">
                    <table class="w-full text-sm">
                        <thead class="text-xs text-gray-500 uppercase border-b bg-gray-100">
                        </thead>
                        <tbody id="tbody-conexiones" class="divide-y bg-white">
                            <textarea id="auto-textarea" rows="1" placeholder="CODIGO" oninput="this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px';" class="w-full resize-none overflow-hidden rounded-xl border border-slate-300 bg-white p-3 text-slate-800 placeholder-slate-400 shadow-sm transition-all focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-700 "></textarea>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- BOTONES FINALES -->
            <div class="mt-8 pt-4 border-t flex justify-end gap-3">
             </div>
    </div>

    <!-- SCRIPT PARA GENERACIÓN DINÁMICA DE HASTA 100+ FILAS -->
    <script>

        function addRow(tableId, type) {
            const tbody = document.getElementById(tableId);
            const rowCount = tbody.children.length + 1;
            const tr = document.createElement('tr');

            let innerHTML = `<td class="py-1 px-2 text-center text-gray-400 font-mono text-xs">${rowCount}</td>`;

            if (type === 'ceros') {
                innerHTML += `<td class="py-1 px-2"><input type="text" placeholder="Código..." class="w-full p-1 border rounded font-mono uppercase focus:ring-1 focus:ring-orange-500 outline-none text-xs"></td>`;
            } else if (type === '50') {
                innerHTML += `
                    <td class="py-1 px-2"><input type="text" pattern="[0-9]*" placeholder="Código..." class="w-full p-1 border rounded font-mono uppercase focus:ring-1 focus:ring-orange-500 outline-none text-xs"></td>
                    <td class="py-1 px-2"><input type="number" pattern="[0-9]*" min="1" placeholder="Cant." class="w-full p-1 border rounded text-center focus:ring-1 focus:ring-orange-500 outline-none text-xs"></td>
                `;
            } else if (type === 'conexiones') {
                innerHTML += `
                    <td class="py-1 px-2"><input type="text" pattern="[0-9]*" placeholder="Código..." class="w-full p-1 border rounded font-mono uppercase focus:ring-1 focus:ring-orange-500 outline-none text-xs"></td>
                `;
            }

            tr.innerHTML = innerHTML;
            tbody.appendChild(tr);
            
        }
    </script>
</body>
</html>
